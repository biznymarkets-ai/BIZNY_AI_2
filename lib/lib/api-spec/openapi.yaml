openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Bizny API - Productivity and venture coordination platform
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: users
    description: User profiles
  - name: opportunities
    description: Opportunities discovery
  - name: marketplace
    description: Marketplace listings
  - name: templates
    description: Venture templates
  - name: ventures
    description: Active ventures
  - name: feed
    description: Feed posts
  - name: copilot
    description: AI Co-Pilot
  - name: updates
    description: Platform updates
  - name: deals
    description: Deal Desk coordination
  - name: notifications
    description: Notifications
  - name: dashboard
    description: Dashboard stats
  - name: openai
    description: OpenAI AI chat operations
  - name: industryTargets
    description: Industry growth targets
  - name: fieldAgent
    description: Field agent verification workflow

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRegistration"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (directory)
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: role
          in: query
          schema:
            type: string
        - name: industry
          in: query
          schema:
            type: string
        - name: country
          in: query
          schema:
            type: string
        - name: stateCity
          in: query
          schema:
            type: string
        - name: verificationStatus
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserPublic"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update user profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}/follow:
    post:
      operationId: followUser
      tags: [users]
      summary: Follow a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowStatus"
    delete:
      operationId: unfollowUser
      tags: [users]
      summary: Unfollow a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowStatus"

  /users/{id}/follow-status:
    get:
      operationId: getFollowStatus
      tags: [users]
      summary: Get follow relationship status with another user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowStatus"

  /users/{id}/followers:
    get:
      operationId: listFollowers
      tags: [users]
      summary: List followers of a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserMini"

  /users/{id}/following:
    get:
      operationId: listFollowing
      tags: [users]
      summary: List users a user is following
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserMini"

  /users/{id}/posts:
    get:
      operationId: listUserPosts
      tags: [users]
      summary: List posts by a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Post"

  /opportunities:
    get:
      operationId: listOpportunities
      tags: [opportunities]
      summary: List opportunities
      parameters:
        - name: type
          in: query
          schema:
            type: string
        - name: industry
          in: query
          schema:
            type: string
        - name: country
          in: query
          schema:
            type: string
        - name: role
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Opportunity"
    post:
      operationId: createOpportunity
      tags: [opportunities]
      summary: Create an opportunity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpportunityInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Opportunity"

  /opportunities/{id}:
    get:
      operationId: getOpportunity
      tags: [opportunities]
      summary: Get opportunity details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Opportunity"

  /marketplace:
    get:
      operationId: listListings
      tags: [marketplace]
      summary: List marketplace listings
      parameters:
        - name: industry
          in: query
          schema:
            type: string
        - name: country
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Listing"
    post:
      operationId: createListing
      tags: [marketplace]
      summary: Create a marketplace listing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"

  /marketplace/{id}:
    get:
      operationId: getListing
      tags: [marketplace]
      summary: Get listing details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"

  /templates:
    get:
      operationId: listTemplates
      tags: [templates]
      summary: List venture templates
      parameters:
        - name: industry
          in: query
          schema:
            type: string
        - name: creatorId
          in: query
          schema:
            type: integer
        - name: visibility
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VentureTemplate"
    post:
      operationId: createTemplate
      tags: [templates]
      summary: Create a new venture template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VentureTemplateInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VentureTemplate"

  /templates/{id}:
    get:
      operationId: getTemplate
      tags: [templates]
      summary: Get template details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VentureTemplate"
    put:
      operationId: updateTemplate
      tags: [templates]
      summary: Update a venture template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VentureTemplateInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VentureTemplate"
    delete:
      operationId: deleteTemplate
      tags: [templates]
      summary: Delete a venture template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /templates/{id}/clone:
    post:
      operationId: cloneTemplate
      tags: [templates]
      summary: Clone a template to your library
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Cloned template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VentureTemplate"

  /templates/{id}/follow:
    post:
      operationId: followTemplate
      tags: [templates]
      summary: Follow a template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Followed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
    delete:
      operationId: unfollowTemplate
      tags: [templates]
      summary: Unfollow a template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Unfollowed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean

  /templates/{id}/save:
    post:
      operationId: saveTemplate
      tags: [templates]
      summary: Save a template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
    delete:
      operationId: unsaveTemplate
      tags: [templates]
      summary: Unsave a template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Unsaved
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean

  /templates/{id}/adopt:
    post:
      operationId: adoptTemplate
      tags: [templates]
      summary: Adopt a template — creates an execution instance
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                instanceType:
                  type: string
                country:
                  type: string
                stateCity:
                  type: string
                startDate:
                  type: string
      responses:
        "201":
          description: Execution instance created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionInstance"

  /templates/{id}/fork:
    post:
      operationId: forkTemplate
      tags: [templates]
      summary: Fork a template to create a customised copy
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
      responses:
        "201":
          description: Forked template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VentureTemplate"

  /templates/{id}/status:
    get:
      operationId: getTemplateStatus
      tags: [templates]
      summary: Get follow/save status of a template for the current user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  following:
                    type: boolean
                  saved:
                    type: boolean

  /execution-instances:
    get:
      operationId: listExecutionInstances
      tags: [execution-instances]
      summary: List the current user's execution instances
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExecutionInstance"
    post:
      operationId: createExecutionInstance
      tags: [execution-instances]
      summary: Create a standalone execution instance (no template)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecutionInstanceInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionInstance"

  /execution-instances/{id}:
    get:
      operationId: getExecutionInstance
      tags: [execution-instances]
      summary: Get a single execution instance
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionInstance"
    patch:
      operationId: updateExecutionInstance
      tags: [execution-instances]
      summary: Update an execution instance
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecutionInstanceUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionInstance"
    delete:
      operationId: deleteExecutionInstance
      tags: [execution-instances]
      summary: Delete an execution instance
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /execution-instances/{id}/milestones/{index}/complete:
    post:
      operationId: completeMilestone
      tags: [execution-instances]
      summary: Mark a milestone complete and auto-publish a progress post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: index
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                evidenceUrls:
                  type: array
                  items:
                    type: string
                notes:
                  type: string
      responses:
        "200":
          description: Milestone completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionInstance"

  /execution-instances/{id}/milestones/{index}/uncomplete:
    post:
      operationId: uncompleteMilestone
      tags: [execution-instances]
      summary: Unmark a milestone as complete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: index
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Milestone uncompleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionInstance"

  /ventures:
    get:
      operationId: listVentures
      tags: [ventures]
      summary: List user's active ventures
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Venture"
    post:
      operationId: createVenture
      tags: [ventures]
      summary: Start a venture from a template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VentureInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Venture"

  /ventures/{id}:
    get:
      operationId: getVenture
      tags: [ventures]
      summary: Get venture details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Venture"

  /ventures/{id}/progress:
    get:
      operationId: getVentureProgress
      tags: [ventures]
      summary: Get venture daily progress entries
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProgressEntry"
    post:
      operationId: addProgressEntry
      tags: [ventures]
      summary: Add a daily progress entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressEntryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressEntry"

  /feed:
    get:
      operationId: listFeed
      tags: [feed]
      summary: Get unified feed posts
      parameters:
        - name: postType
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Post"
    post:
      operationId: createPost
      tags: [feed]
      summary: Create a post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"

  /feed/{id}/react:
    post:
      operationId: reactToPost
      tags: [feed]
      summary: React to a post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReactionInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"

  /feed/{id}/comments:
    get:
      operationId: listPostComments
      tags: [feed]
      summary: List comments on a post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PostComment"
    post:
      operationId: createPostComment
      tags: [feed]
      summary: Add a comment to a post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostCommentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostComment"

  /feed/{id}/repost:
    post:
      operationId: repostPost
      tags: [feed]
      summary: Repost a post (direct or with quote)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepostInput"
      responses:
        "201":
          description: Created repost
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"

  /feed/{id}/save:
    post:
      operationId: savePost
      tags: [feed]
      summary: Save a post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaveStatus"
    delete:
      operationId: unsavePost
      tags: [feed]
      summary: Unsave a post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaveStatus"

  /openai/conversations:
    get:
      operationId: listOpenaiConversations
      tags: [openai]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiConversation"
    post:
      operationId: createOpenaiConversation
      tags: [openai]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversation"

  /openai/conversations/{id}:
    get:
      operationId: getOpenaiConversation
      tags: [openai]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
    delete:
      operationId: deleteOpenaiConversation
      tags: [openai]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
